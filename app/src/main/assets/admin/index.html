<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyChat Control Center</title><style>
:root{--bg:#eef3ff;--glass:#ffffffaa;--line:#ffffffbb;--ink:#152038;--muted:#69758c;--a:#665cff;--b:#00b7ff;--danger:#e94b6d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:radial-gradient(circle at 10% 10%,#d9d7ff,transparent 32%),radial-gradient(circle at 90% 20%,#c7f6ff,transparent 30%),linear-gradient(135deg,#f7f8ff,#e8efff);color:var(--ink);min-height:100vh}.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid var(--line);box-shadow:0 20px 60px #38466b18}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.loginCard{width:min(430px,100%);padding:30px;border-radius:30px}.brand{font-size:26px;font-weight:950}.muted{color:var(--muted)}input,select{width:100%;padding:13px 14px;border:1px solid #dfe5f3;border-radius:14px;background:#ffffffcc;outline:none}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:850;cursor:pointer}.primary{color:white;background:linear-gradient(135deg,var(--a),var(--b))}.danger{color:white;background:linear-gradient(135deg,#ff667f,var(--danger))}.ghost{background:#eef2fa;color:#46526a}.shell{width:min(1500px,calc(100% - 20px));margin:10px auto;min-height:calc(100vh - 20px);display:flex;border-radius:30px;overflow:hidden}.side{width:230px;padding:16px;border-right:1px solid var(--line);background:#ffffff65}.side h1{font-size:20px}.tab{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:14px;margin:5px 0;font-weight:800;color:#59657c;cursor:pointer}.tab.active{color:white;background:linear-gradient(135deg,var(--a),var(--b))}.main{flex:1;min-width:0;padding:20px;overflow:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:15px}.top h2{margin:0;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{padding:17px;border-radius:22px;background:#ffffffaa;border:1px solid #fff}.metric{font-size:26px;font-weight:950}.table{overflow:auto;border-radius:18px;background:#ffffffaa;border:1px solid #fff;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:10px 12px;border-bottom:1px solid #e7ebf4;text-align:left;font-size:12px}th{font-size:10px;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:#f7f9ff}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#17203855;backdrop-filter:blur(12px);display:grid;place-items:center;padding:15px;z-index:10}.modalCard{width:min(1100px,100%);max-height:90vh;overflow:auto;padding:20px;border-radius:26px}.search{display:flex;gap:8px}.search input{flex:1}.pill{padding:4px 8px;border-radius:999px;background:#eaf0fa}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 16px;background:#182237;color:#fff;border-radius:13px;z-index:20}
@media(max-width:800px){.shell{width:100%;margin:0;border-radius:0}.side{width:70px;padding:8px}.side h1{font-size:0}.side h1:after{content:'MC';font-size:18px}.tab{font-size:0;text-align:center}.tab:first-letter{font-size:18px}.main{padding:12px}}
</style></head><body>
<div id="login" class="login"><form id="loginForm" class="loginCard glass"><div class="brand">🛡️ MyChat Control</div><p class="muted">Full PostgreSQL + media administration</p><div class="field"><label>Username</label><input id="au" autocomplete="username" required></div><div class="field"><label>Password</label><input id="ap" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Sign in</button><p id="le" class="muted"></p></form></div>
<div id="shell" class="shell glass hidden"><aside class="side"><h1>MyChat Admin</h1><button class="tab active" data-tab="dashboard">📊 Dashboard</button><button class="tab" data-tab="users">👥 Users</button><button class="tab" data-tab="chats">💬 Chats</button><button class="tab" data-tab="media">🖼️ Media</button><button class="tab" data-tab="devices">📱 Devices</button><button class="tab" data-tab="sessions">🔐 Sessions</button><button class="tab" data-tab="errors">🧪 Errors</button><button class="tab" data-tab="audit">📜 Audit</button><button class="tab" data-tab="database">🗄️ Database</button><button class="tab" data-tab="storage">🧹 Storage</button><button class="tab" data-tab="runtime">🌐 Backend</button><button id="logout" class="btn ghost" style="width:100%;margin-top:15px">Logout</button></aside><main class="main"><div class="top"><h2 id="title">Dashboard</h2><span class="muted" id="adminName"></span></div><section id="content"></section></main></div><div id="modal" class="modal hidden"><div class="modalCard glass"><div id="modalBody"></div><button class="btn ghost" onclick="closeModal()">Close</button></div></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch('/admin-api/'+path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(x){$('#toast').textContent=x;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),1800)}
function closeModal(){$('#modal').classList.add('hidden')};function modal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden')}
function yes(x){return confirm(x)}
async function boot(){try{const d=await api('me');$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');$('#adminName').textContent='Admin: '+d.admin;load('dashboard')}catch{}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login',{method:'POST',body:JSON.stringify({username:$('#au').value,password:$('#ap').value})});boot()}catch(x){$('#le').textContent=x.message}};$('#logout').onclick=async()=>{await api('logout',{method:'POST'});location.reload()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.tab)});
async function load(t){$('#title').textContent=t[0].toUpperCase()+t.slice(1);try{return await ({dashboard,users,chats,media,devices,sessions,errors,audit,database,storage,runtime}[t])()}catch(e){$('#content').innerHTML='<div class="card">Error: '+esc(e.message)+'</div>'}}
async function dashboard(){const d=await api('summary');$('#content').innerHTML='<div class="cards">'+[['Users',d.users],['Online',d.online],['Chats',d.conversations],['Messages',d.messages],['Media',d.media],['Devices',d.devices],['Sessions',d.sessions],['Storage',fmtBytes(d.storage_bytes)]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="metric">${x[1]}</div></div>`).join('')+'</div><div class="card" style="margin-top:12px"><b>Runtime</b><p class="muted">Node ${esc(d.node)} · WebSockets ${d.connections} · Uptime ${Math.round(d.uptime/60)} min</p></div>'}
function fmtBytes(n){n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
async function runtime(){const d=await api('runtime');$('#content').innerHTML=`<div class="card"><h3>Backend / Cloudflare Quick Tunnel</h3><p class="muted">Local-only control. Saving updates the local backend URL and publishes it to the GitHub frontend repository so Vercel picks it up automatically.</p><div class="field"><label>Current backend URL</label><input id="runtimeUrl" placeholder="https://xxxx.trycloudflare.com" value="${esc(d.backend_url||d.detected_url||'')}"></div><div class="actions"><button class="btn primary" onclick="saveRuntime()">Save + Publish</button><button class="btn ghost" onclick="detectRuntime()">Detect from Cloudflare log</button></div><p class="muted" style="margin-top:10px">Detected: ${esc(d.detected_url||'Not found')}<br>GitHub repo: ${esc(d.github_repo||'mychat-frontend')}<br>Updated: ${esc(d.updated_at||'-')}</p></div>`}
async function detectRuntime(){const d=await api('runtime');$('#runtimeUrl').value=d.detected_url||d.backend_url||'';toast(d.detected_url?'Cloudflare URL detected':'No Quick Tunnel URL found')}
async function saveRuntime(){const url=$('#runtimeUrl').value.trim();if(!url)return alert('Enter the current Quick Tunnel URL');const d=await api('runtime',{method:'POST',body:JSON.stringify({backend_url:url})});toast(d.published?'Saved and published to GitHub':'Saved locally; GitHub publish failed');if(!d.published)alert('Local URL saved, but GitHub publish failed: '+(d.publishError||'Unknown error'));runtime()}

function userRows(rows){return rows.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.phone)}</span></td><td>${esc(u.created_at)}</td><td>${esc(u.last_seen||'-')}</td><td>${u.admin_disabled?'Disabled':'Enabled'}</td><td class="actions"><button class="btn ghost" onclick='editUser(${JSON.stringify(u)})'>Edit</button><button class="btn ghost" onclick='resetPw(${u.id})'>Password</button><button class="btn ghost" onclick='toggleUser(${u.id},${u.admin_disabled?0:1})'>${u.admin_disabled?'Enable':'Disable'}</button><button class="btn danger" onclick='deleteUser(${u.id})'>Delete</button></td></tr>`).join('')}
async function users(){const d=await api('users');$('#content').innerHTML=`<div class="search"><input id="uq" placeholder="Search name / phone"><button class="btn primary" onclick="searchUsers()">Search</button></div><div class="table"><table><thead><tr><th>ID</th><th>User</th><th>Created</th><th>Last seen</th><th>Status</th><th>Actions</th></tr></thead><tbody id="ut">${userRows(d.users)}</tbody></table></div>`}
async function searchUsers(){const d=await api('users?q='+encodeURIComponent($('#uq').value));$('#ut').innerHTML=userRows(d.users)}
function editUser(u){modal(`<h3>Edit user #${u.id}</h3><div class="field"><label>Name</label><input id="en" value="${esc(u.name)}"></div><div class="field"><label>Phone</label><input id="ep" value="${esc(u.phone)}"></div><button class="btn primary" onclick="saveUser(${u.id})">Save</button>`)}
async function saveUser(id){await api('user/update',{method:'POST',body:JSON.stringify({id,name:$('#en').value,phone:$('#ep').value})});closeModal();toast('User updated');users()}
async function resetPw(id){const p=prompt('New password (minimum 6 characters)');if(!p)return;if(p.length<6)return alert('Password too short');await api('user/password',{method:'POST',body:JSON.stringify({id,password:p})});toast('Password reset')}
async function toggleUser(id,disabled){await api('user/disable',{method:'POST',body:JSON.stringify({id,disabled:!!disabled})});toast('Account updated');users()}
async function deleteUser(id){if(!yes('Permanently delete this user, sessions, messages and owned media?'))return;await api('user/delete',{method:'POST',body:JSON.stringify({id})});toast('User deleted');users()}
async function chats(){const d=await api('chats');$('#content').innerHTML='<div class="table"><table><thead><tr><th>ID</th><th>Members</th><th>Messages</th><th>Updated</th><th>Actions</th></tr></thead><tbody>'+d.chats.map(c=>`<tr><td>${c.id}</td><td>${esc(c.names)}</td><td>${c.message_count}</td><td>${esc(c.updated_at)}</td><td class="actions"><button class="btn ghost" onclick="viewChat(${c.id})">Messages</button><button class="btn danger" onclick="deleteChat(${c.id})">Delete chat</button></td></tr>`).join('')+'</tbody></table></div>'}
async function viewChat(id){const d=await api('messages?conversation_id='+id);modal(`<h3>Conversation #${id}</h3>${d.messages.map(m=>`<div class="card" style="margin:7px 0"><b>${esc(m.sender_name)}</b> <span class="muted">#${m.id}</span><div>${esc(m.body)}</div><small>${esc(m.created_at)} · ${m.read_at?'read':m.delivered_at?'delivered':'sent'}</small><br><button class="btn danger" onclick="deleteMsg(${m.id},${id})">Delete message</button></div>`).join('')||'<p class="muted">No messages</p>'}`)}
async function deleteMsg(id,c){if(!yes('Delete this message and attached media?'))return;await api('message/delete',{method:'POST',body:JSON.stringify({id})});toast('Deleted');viewChat(c)}
async function deleteChat(id){if(!yes('Delete entire conversation and its media?'))return;await api('conversation/delete',{method:'POST',body:JSON.stringify({id})});toast('Chat deleted');chats()}
async function media(){const d=await api('media');$('#content').innerHTML='<div class="table"><table><thead><tr><th>ID</th><th>File</th><th>Type</th><th>Size</th><th>Owner</th><th>Message</th><th>Exists</th><th>Action</th></tr></thead><tbody>'+d.media.map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.original_name)}</td><td>${esc(m.mime)}</td><td>${fmtBytes(m.size)}</td><td>${esc(m.owner_name)}<br>${esc(m.phone)}</td><td>${m.message_id||'-'}</td><td>${m.exists?'Yes':'Missing'}</td><td class="actions">${m.exists?`<a class="btn ghost" target="_blank" href="/admin-api/media/download?id=${encodeURIComponent(m.id)}">Open</a>`:''}<button class="btn danger" onclick='deleteMedia("${esc(m.id)}")'>Delete</button></td></tr>`).join('')+'</tbody></table></div>'}
async function deleteMedia(id){if(!yes('Delete media file and database record?'))return;await api('media/delete',{method:'POST',body:JSON.stringify({id})});toast('Media deleted');media()}
async function devices(){const d=await api('devices');$('#content').innerHTML='<div class="table"><table><thead><tr><th>ID</th><th>User</th><th>Device</th><th>Agent</th><th>Updated</th><th>Action</th></tr></thead><tbody>'+d.devices.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}<br>${esc(x.phone)}</td><td>${esc(x.device_id||'-')}</td><td>${esc(x.user_agent||'-')}</td><td>${esc(x.updated_at)}</td><td><button class="btn danger" onclick="revokeDevice(${x.id})">Revoke</button></td></tr>`).join('')+'</tbody></table></div>'}
async function revokeDevice(id){if(!yes('Revoke this FCM/device token?'))return;await api('device/revoke',{method:'POST',body:JSON.stringify({id})});devices()}
async function sessions(){const d=await api('sessions');$('#content').innerHTML='<div class="table"><table><thead><tr><th>User</th><th>Created</th><th>Expires</th><th>Agent</th><th>Action</th></tr></thead><tbody>'+d.sessions.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.phone)}</td><td>${esc(x.created_at)}</td><td>${esc(x.expires_at)}</td><td>${esc(x.user_agent||'-')}</td><td><button class="btn danger" onclick="revokeSessions(${x.user_id})">Logout all</button></td></tr>`).join('')+'</tbody></table></div>'}
async function revokeSessions(id){await api('session/revoke',{method:'POST',body:JSON.stringify({user_id:id})});toast('Sessions revoked');sessions()}
async function errors(){const d=await api('errors');$('#content').innerHTML='<div class="table"><table><thead><tr><th>Time</th><th>User</th><th>Kind</th><th>Message</th></tr></thead><tbody>'+d.errors.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${x.user_id||'-'}</td><td>${esc(x.kind)}</td><td>${esc(x.message)}</td></tr>`).join('')+'</tbody></table></div>'}
async function audit(){const d=await api('audit');$('#content').innerHTML='<div class="table"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Payload</th></tr></thead><tbody>'+d.audit.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.admin)}</td><td>${esc(x.action)}</td><td>${esc(JSON.stringify(x.payload||{}))}</td></tr>`).join('')+'</tbody></table></div>'}
async function database(){const d=await api('db');$('#content').innerHTML=`<div class="cards"><div class="card"><div class="muted">Database</div><div class="metric">PostgreSQL</div></div><div class="card"><div class="muted">DB size</div><div class="metric">${fmtBytes(d.size_bytes)}</div></div><div class="card"><div class="muted">Concurrency</div><div class="metric">MVCC</div></div></div><div class="table"><table><thead><tr><th>Table</th><th>Disk size</th></tr></thead><tbody>${d.tables.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmtBytes(x.size)}</td></tr>`).join('')}</tbody></table></div>`}
async function storage(){const d=await api('summary');$('#content').innerHTML=`<div class="card"><h3>Storage control</h3><p class="muted">Media binaries live on the server filesystem; PostgreSQL stores metadata and message references. Orphaned files and incomplete upload folders can be removed safely by the cleanup tool.</p><p>Media: <b>${fmtBytes(d.storage_bytes)}</b></p><button class="btn danger" onclick="cleanup()">Cleanup orphan media + temp uploads</button></div>`}
async function cleanup(){if(!yes('Remove unreferenced media files and temporary upload chunks?'))return;const d=await api('storage/cleanup',{method:'POST'});toast('Removed '+d.removed+' items');storage()}
boot();
</script></body></html>
